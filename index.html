<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEICHYY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <!-- Background Video -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="bg.mp4" type="video/mp4">
  </video>

  <!-- Navbar -->
  <nav class="navbar">
    <img src="logo.png" class="logo" alt="HEICHYY">

    <ul>
      <li><a class="active" href="#">Home</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="center">
    <section class="profile-card">

      <img src="pfp.jpg" class="pfp" alt="Profile Picture">

      <h1>𝕐𝕦𝕚?</h1>

      <div class="buttons">
        <a href="https://open.spotify.com/user/31cbij2zok3x3uzok4t6l35csyya"
           target="_blank"
           class="btn">
          Spotify
        </a>

        <a href="https://www.instagram.com/yumechyyy/"
           target="_blank"
           class="btn">
          Instagram
        </a>
      </div>

    </section>
  </main>

</div>

<!-- Background Music -->
<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Music Controls -->
<div class="music-controls">
  <button id="muteBtn">
  <svg id="speakerIcon" width="18" height="18" viewBox="0 0 24 24" fill="#FF4FD8">
    <path d="M14 3.23v17.54c0 .51-.58.8-.99.49L7.91 17H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3.91l5.1-4.26c.41-.31.99-.02.99.49z"/>
    <path d="M16.5 8.5a1 1 0 0 1 1.41 0 5 5 0 0 1 0 7.07 1 1 0 1 1-1.41-1.41 3 3 0 0 0 0-4.24 1 1 0 0 1 0-1.42z"/>
  </svg>
</button>
  <input type="range" id="volume" min="0" max="100" value="35">
</div>

<script>
const bgm = document.getElementById("bgm");
const volume = document.getElementById("volume");
const muteBtn = document.getElementById("muteBtn");
const speakerIcon = document.getElementById("speakerIcon");

bgm.volume = 0.35;

document.addEventListener("click", () => {
    bgm.play().catch(() => {});
}, { once: true });

volume.addEventListener("input", () => {
    bgm.volume = volume.value / 100;
    bgm.muted = bgm.volume === 0;
    updateIcon();
});

muteBtn.addEventListener("click", () => {
    bgm.muted = !bgm.muted;
    updateIcon();
});

function updateIcon() {
    if (bgm.muted) {
        speakerIcon.innerHTML = `
            <path d="M14 3.23v17.54c0 .51-.58.8-.99.49L7.91 17H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3.91l5.1-4.26c.41-.31.99-.02.99.49z"/>
            <line x1="4" y1="4" x2="20" y2="20" stroke="#FF4FD8" stroke-width="2" stroke-linecap="round"/>
        `;
    } else {
        speakerIcon.innerHTML = `
            <path d="M14 3.23v17.54c0 .51-.58.8-.99.49L7.91 17H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3.91l5.1-4.26c.41-.31.99-.02.99.49z"/>
            <path d="M16.5 8.5a1 1 0 0 1 1.41 0 5 5 0 0 1 0 7.07 1 1 0 1 1-1.41-1.41 3 3 0 0 0 0-4.24 1 1 0 0 1 0-1.42z"/>
        `;
    }
}

updateIcon();
</script>

</body>
</html>
